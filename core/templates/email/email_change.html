{% extends "email/base.html" %}
{% block title %}Confirm your new e-mail address{% endblock %}
{% block content %}
<h1 style="font-size:22px;margin:0 0 16px">Confirm your new e-mail address</h1>
<p style="margin:0 0 16px">Use this code to confirm your new e-mail address:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:4px;margin:0 0 16px">{{ code }}</p>
<p style="margin:0">If you did not request this, you can ignore this message.</p>
{% endblock %}
