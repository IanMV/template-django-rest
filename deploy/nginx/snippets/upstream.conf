resolver 127.0.0.11 valid=10s ipv6=off;
upstream django {
    zone django 64k;
    server app:8000 resolve;
}
upstream django_issuance {
    zone django_issuance 64k;
    server issuance:8000 resolve;
}
map $uri $django_upstream {
    default django;
    /api/registration/request/ django_issuance;
    /api/password-reset/request/ django_issuance;
    /api/email-change/request/ django_issuance;
}
log_format safe '$remote_addr "$request_method $uri" $status $body_bytes_sent';
access_log /var/log/nginx/access.log safe;
