name: template-auth-dev
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    command: sh -ec 'python manage.py migrate --noinput; exec python manage.py runserver 0.0.0.0:8000'
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.dev
      SECRET_KEY: ${SECRET_KEY:-}
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/login/', timeout=3).status == 204"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
