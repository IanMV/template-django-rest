name: Django & Ruff CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-secret-key-long-enough-for-jwt-signatures
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Setup PDM
      uses: pdm-project/setup-pdm@v4
      with:
        python-version: "3.14"
        enable-pep582: true

    - name: Install dependencies
      run: |
        pdm install -G lint

    - name: Run Django System Checks
      run: |
        pdm run python manage.py check

    - name: Run Django behavior tests
      run: pdm run python manage.py test

    - name: Analysing the code with ruff
      run: |
        pdm run ruff check
