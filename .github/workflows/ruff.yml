name: Static checks

on: [push, pull_request]

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.14"
      - name: Install locked dependencies
        run: pdm sync -G lint
      - name: Check Python lint
        run: pdm run lint
      # shortcut: existing tests target JWT; restore behavior CI after session tests are authorized and updated.
