[project]
name = "sistema-autenticacao-django-rest"
version = "0.1.0"
description = ""
authors = [{ name = "Ian Matheus Veiga", email = "ianmatheusv54@gmail.com" }]
dependencies = ["django>=6.1", "python-dotenv>=1.2.2", "djangorestframework>=3.17.2"]
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "pyright>=1.1.411",
    "pre-commit>=4.6.2",
]
lint = [
    "ruff>=0.16.2",
]
types = [
    "pyright>=1.1.411",
    "django-stubs>=6.0.9",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[tool.pdm]
distribution = false

[tool.ruff]
exclude = ["migrations"]
lint.select = ["F", "DJ", "I"]

[tool.pyright]
exclude = ["**/__pycache__", "**/.venv", "**/migrations"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
