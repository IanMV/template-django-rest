[project]
name = "sistema-autenticacao-django-rest"
version = "0.1.0"
description = ""
authors = [
  { name = "Ian Matheus Veiga", email = "ianmatheusv54@gmail.com" },
]
dependencies = [
  "django>=6.1",
  "djangorestframework>=3.17.2",
  "drf-spectacular>=0.30.0",
  "python-dotenv>=1.2.2",
  "user-agents>=2.2.0",
  "djangorestframework-simplejwt>=5.5.1",
  "redis<6.5,>=6.2",
  "psycopg[binary]>=3.2.0",
  "celery[redis]<5.7,>=5.6",
]
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "ruff>=0.16.2",
    "pip-audit>=2.10.1",
]
lint = [
  "ruff>=0.16.2",
]
types = [
  "django-stubs>=6.0.9",
  "pyright>=1.1.411",
]

[build-system]
requires = [
  "pdm-backend",
]
build-backend = "pdm.backend"

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "python manage.py runserver"
migrate = "python manage.py migrate"
check = "python manage.py check"
test = "python manage.py test"
lint = "ruff check"
format = "ruff format"
migrations-check = "python manage.py makemigrations --check --dry-run"
schema-check = "python manage.py spectacular --validate --fail-on-warn --file /dev/null"
deploy-check = { cmd = "python manage.py check --deploy", env = { DJANGO_SETTINGS_MODULE = "app.settings.prod" } }
verify = { composite = ["check", "migrations-check", "schema-check", "lint", "test"] }

[tool.pyright]
exclude = [
  "**/__pycache__",
  "**/.venv",
  "**/migrations",
]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.ruff]
exclude = [
  "migrations",
]
lint.select = [
  "F",
  "DJ",
  "I",
]
